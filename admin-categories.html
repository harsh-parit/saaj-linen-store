<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Categories — SAAJ</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="admin-layout">

  <!-- SIDEBAR -->
  <aside class="admin-sidebar">
    <h2 class="admin-brand">SAAJ</h2>

    <nav class="admin-nav">
      <a href="admin-dashboard.html">Dashboard</a>
      <a href="admin-products.html">Products</a>
      <a href="admin-categories.html" class="active">Categories</a>
      <a href="#" class="logout" onclick="logoutAdmin()">Logout</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="admin-main">

    <div class="admin-header">
      <h1>Categories</h1>
      <button class="btn-primary" onclick="openCategoryModal()">Add Category</button>
    </div>

    <div class="admin-table-wrapper">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Category Name</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- categories injected from DB -->
        </tbody>
      </table>
    </div>

  </main>

  <!-- ADD / EDIT CATEGORY MODAL -->
  <div id="category-modal" class="admin-modal hidden">
    <div class="modal-box">

      <h3 id="category-modal-title">Add Category</h3>

      <input
        type="text"
        id="category-name"
        placeholder="Category name"
      />

      <div class="modal-actions">
        <button class="btn-primary" onclick="saveCategory()">Save</button>
        <button class="btn-small" onclick="closeCategoryModal()">Cancel</button>
      </div>

    </div>
  </div>

  <!-- SECURITY GUARD -->
  <script type="module" src="js/admin-session-guard.js"></script>

  <!-- LOGOUT -->
  <script type="module">
    import { supabase } from "./js/supabase.js";
    window.logoutAdmin = async function () {
      await supabase.auth.signOut();
      window.location.href = "admin-login.html";
    };
  </script>

  <!-- CATEGORIES LOGIC -->
  <script type="module" src="js/admin-categories.js"></script>

</body>
</html>
