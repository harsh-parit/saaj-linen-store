<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — SAAJ</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="page-wrapper">
  <!-- NAVBAR -->
  <header class="navbar">
    <div class="container nav-content">
        <a href="index.html" class="logo">SAAJ</a>
      <nav class="nav-links">
        <a href="products.html">Shop</a>
        <a href="cart.html" class="cart-icon">
          👜
          <span id="cart-count" class="cart-badge"></span>
        </a>
        <a href="login.html" id="auth-link">Login</a>
      </nav>
    </div>
  </header>

  <!-- CHECKOUT -->
  <section class="checkout-section">
    <div class="container checkout-grid">

      <!-- ADDRESS -->
      <div class="checkout-form">
        <h1>Delivery Details</h1>

        <label>Full Name</label>
        <input type="text" id="name" placeholder="Your name" />

        <label>Address</label>
        <input type="text" id="address" placeholder="Street, City, State" />

        <label>Pincode</label>
        <input type="text" id="pincode" placeholder="Postal code" />

        <button class="btn-primary" id="place-order">Place Order</button>
      </div>

      <!-- SUMMARY -->
      <div class="checkout-summary">
        <h3>Order Summary</h3>

        <div id="checkout-items"></div>
        
        <hr />
        
        <p class="summary-total">
          Subtotal: ₹<span id="checkout-total">0</span>
        </p>
      </div>

    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <p>© 2025 SAAJ. Crafted in linen.</p>
    </div>
  </footer>

  <!-- JS -->
  <script src="js/checkout.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/cart-badge.js"></script>
  </div>
</body>
</html>
