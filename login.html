<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — SAAJ</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- LOGIN ONLY CSS -->
  <link rel="stylesheet" href="css/login.css" />
</head>

<body>
  <div class="site-login-page">
    <div class="site-login-card">

      <div class="site-login-logo">SAAJ</div>
      <div class="site-login-subtitle">
        Login to continue shopping
      </div>

      <form class="site-login-form">
        <label>Email</label>
        <input type="email" placeholder="you@example.com" />

        <label>Password</label>
        <input type="password" placeholder="••••••••" />

        <button type="submit">Login</button>
      </form>

      <div class="site-login-footer">
        New here? Create an account
      </div>

    </div>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
