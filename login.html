<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — SAAJ</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <section class="login-page linen-bg">
    <div class="login-card">
      <h1 class="login-logo">SAAJ</h1>

      <form class="login-form">
        <label>Email</label>
        <input type="email" placeholder="you@example.com" />

        <label>Password</label>
        <input type="password" placeholder="••••••••" />

        <button type="submit" class="btn-primary">Login</button>
      </form>

      <p class="login-footer">
        New here? <a href="#">Create an account</a>
      </p>
    </div>
  </section>

 <script src="js/auth.js"></script>
 
</body>
</html>
