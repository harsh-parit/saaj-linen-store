<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — SAAJ</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Signup CSS -->
  <link rel="stylesheet" href="css/signup.css" />
</head>

<body>
  <div class="signup-page">
    <div class="signup-card">

      <div class="signup-logo">SAAJ</div>
      <div class="signup-subtitle">
        Create your account
      </div>

      <form class="signup-form">
        <label>Name</label>
        <input type="text" id="name" placeholder="Your name" required />

        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" required />

        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required />

        <button type="submit">Create Account</button>
      </form>

      <div class="signup-footer">
        Already have an account?
        <a href="login.html">Login</a>
      </div>

    </div>
  </div>

  <script src="js/signup.js"></script>
</body>
</html>
