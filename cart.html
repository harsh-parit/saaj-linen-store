<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart — SAAJ</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="page-wrapper">
  <!-- NAVBAR -->
  <header class="navbar">
    <div class="container nav-content">
      <a href="index.html" class="logo">SAAJ</a>
      <nav class="nav-links">
        <a href="products.html">Shop</a>
        <a href="#">About</a>
        <a href="login.html" id="auth-link">Login</a>
        <a href="cart.html" class="cart-icon">
          👜
          <span id="cart-count" class="cart-badge"></span>
        </a>
      </nav>
    </div>
  </header>

  <!-- CART -->
  <section class="cart-section">
    <div class="container">
      <h1>Your Cart</h1>

      <div class="cart-grid">
        <div id="cart-items"></div>

        <div class="cart-summary">
          <h3>Order Summary</h3>

          <div id="cart-summary-items"></div>

          <hr />

          <p class="summary-total">
            Subtotal: ₹<span id="subtotal">0</span>
          </p>
          
          <button class="btn-primary" onclick="window.location.href='checkout.html'">
            Checkout</button>
        </div>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <p>© 2025 SAAJ. Crafted in linen.</p>
    </div>
  </footer>

  <!-- JS -->
  <script src="js/cart.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/cart-badge.js"></script>
  </div>
</body>
</html>
