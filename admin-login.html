<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — SAAJ</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin-login-body">

  <div class="admin-login-container">
    <div class="admin-login-box">
      <h1 class="admin-logo">SAAJ</h1>
      <p class="admin-subtitle">Admin Access</p>

      <form>
        <label>Email</label>
        <input type="email" placeholder="admin@saaj.com" />

        <label>Password</label>
        <input type="password" placeholder="••••••••" />

        <button type="submit" class="btn-primary">
          Login
        </button>
      </form>

      <p class="admin-note">
        Authorized personnel only
      </p>
    </div>
  </div>
  <script src="js/admin-guard.js"></script>
  <script type="module" src="js/admin-login.js"></script>
</body>
</html>
